<body>

<div class="app">

<header>

<div class="row">

<div id="workTitle">
ことのは法音
</div>

<div class="badge">
Lv <span id="level">1</span>
</div>

</div>

<h2 id="chapterTitle">
宗派を選択してください
</h2>

<div class="progress">

<div
id="progressBar"
class="progress-fill">
</div>

</div>

<div class="exp">
EXP :
<span id="exp">0</span>
</div>

</header>

<!-- 宗派一覧 -->

<div id="workSelect">
</div>

<!-- お経一覧 -->

<div id="sutraSelect"
     style="display:none;">
</div>

<!-- 章一覧 -->

<div id="chapterSelect"
     style="display:none;">
</div>

<!-- 学習画面 -->

<div id="studyUI"
     style="display:none;">

<section
class="passage"
id="lessonScreen">
</section>

<!-- 読解 -->

<div
class="translation"
id="readingQuiz">
</div>

<!-- 現代語訳 -->

<div
class="translation"
id="translation">
</div>

<!-- 章クリア -->

<div
id="chapterComplete"
style="display:none;margin:20px;">

<button
class="btn green"
onclick="backToChapter()">

章選択へ戻る

</button>

</div>

<!-- 進捗 -->

<div class="status">

学習進捗

<span id="count">
0 / 0
</span>

</div>

<!-- ボタン -->

<div class="actions">

<button
onclick="backToTitle()">

タイトルへ戻る

</button>

<button
onclick="backToChapter()">
章選択へ戻る
</button>

<button
id="translationBtn"
class="btn green lock">

現代語訳

</button>

</div>

</div>

</div>

<!-- 背景 -->

<div id="overlay"></div>

<!-- 問題ドロワー -->

<div
class="drawer"
id="drawer">

<button
class="close-btn"
onclick="closeDrawer()">

✕

</button>

<h2 id="term"></h2>

<div class="question">

意味を選びましょう

</div>

<div id="choices">
</div>

<div id="result">
</div>

</div>
